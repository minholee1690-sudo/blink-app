<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>눈으로 말해요</title>
<meta name="description" content="눈을 깜박이면 마음이 단어가 됩니다. 카메라로 눈 깜박임을 인식해 인사말을 보여 주는 앱">
<meta property="og:type" content="website">
<meta property="og:title" content="눈으로 말해요">
<meta property="og:description" content="눈을 깜박이면 마음이 단어가 됩니다">
<meta property="og:url" content="https://blink-app-rose.vercel.app/">
<meta property="og:image" content="https://blink-app-rose.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://blink-app-rose.vercel.app/og-image.png">
<meta name="theme-color" content="#f3f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  /* 레이아웃: 한 화면(100dvh) 안에 ① 단어판 ② 카메라+깜박임 상태 ③ 깜박임 예시 ④ 버튼
     설정·기록은 화면 아래 접이식 */
  :root{
    --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2621; --muted:#66746b;
    --accent:#2f7d5b; --accent-soft:#dcefe5; --line:#d6ddd8; --warn:#b4552d; --on-accent:#ffffff;
    --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
    --body:"Noto Sans KR",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a17; --panel:#1d2521; --fg:#e8eee9; --muted:#9aa8a0;
      --accent:#6cc79c; --accent-soft:#233a2f; --line:#2e3833; --warn:#e48a62; --on-accent:#10251b; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
    -webkit-tap-highlight-color:transparent}

  /* ---- 한 화면 영역 ---- */
  .screen{
    height:100vh; height:100dvh;
    max-width:560px; margin:0 auto;
    padding:max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display:grid; grid-template-rows:auto minmax(0,1fr) auto auto auto; gap:10px;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-family:var(--display);font-size:1.15rem;margin:0;white-space:nowrap}
  .hint{color:var(--muted);font-size:.8rem;margin:0;text-align:right}

  /* ① 단어판 */
  .board{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    display:grid;place-items:center;text-align:center;padding:12px;min-height:0}
  #word{font-family:var(--display);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1.15;margin:0;color:var(--accent);
    word-break:keep-all;transition:transform .25s ease}
  #word.pop{transform:scale(1.08)}
  #word.idle{color:var(--muted);font-size:clamp(1.05rem,4.6vw,1.4rem)}

  /* ② 카메라 + 상태 */
  .live{display:grid;grid-template-columns:38% minmax(0,1fr);gap:10px;align-items:stretch}
  .cam{position:relative;aspect-ratio:3/4;max-width:100%;background:#000;border-radius:12px;overflow:hidden;max-height:24dvh;justify-self:start;width:100%}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
  .cam .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:8px;text-align:center;font-size:.75rem}
  .status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:center;min-width:0}
  .label{font-size:.72rem;letter-spacing:.04em;color:var(--muted);font-weight:700;margin:0}
  .dots{display:flex;gap:7px;min-height:20px;align-items:center;flex-wrap:wrap}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--accent)}
  .dots .none{font-size:.8rem;color:var(--muted)}
  .meter{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden;position:relative}
  .meter i{display:block;height:100%;width:0;background:var(--accent)}
  .meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
  .hold{height:4px;background:transparent;border-radius:2px;overflow:hidden}
  .hold i{display:block;height:100%;width:0;background:var(--warn)}

  /* ③ 깜박임 예시 */
  .map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
  .map li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 1px;
    display:grid;gap:4px;justify-items:center;text-align:center;min-width:0;transition:background .2s,border-color .2s}
  .map .sig{display:flex;gap:3px;height:12px;align-items:center}
  .map .sig span{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .map .sig .bar{width:30px;height:8px;border-radius:4px}
  .map .cnt{font-size:.68rem;color:var(--muted);line-height:1.2}
  .map .w{font-weight:700;font-size:clamp(.64rem,2.9vw,.85rem);letter-spacing:-.02em;line-height:1.2;word-break:keep-all}
  .map li.on{background:var(--accent);border-color:var(--accent)}
  .map li.on .w,.map li.on .cnt{color:var(--on-accent)}
  .map li.on .sig span{background:var(--on-accent)}

  /* ④ 버튼 */
  .btns{display:grid;grid-template-columns:1fr auto;gap:8px}
  button{font:inherit;border:0;border-radius:12px;padding:13px 14px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;min-height:48px}
  button:disabled{opacity:.7}
  button.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:400;font-size:.85rem}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---- 화면 아래: 설정·기록 ---- */
  .more{max-width:560px;margin:0 auto;padding:4px max(14px, env(safe-area-inset-right)) 32px max(14px, env(safe-area-inset-left));display:grid;gap:10px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  summary{cursor:pointer;font-weight:700}
  details[open] summary{margin-bottom:10px}
  label{display:grid;gap:4px;font-size:.88rem;margin-bottom:10px}
  input[type=range]{width:100%}
  .small{font-size:.8rem;color:var(--muted);margin:0}
  #log{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted);max-height:180px;overflow:auto}
  @media (prefers-reduced-motion: reduce){ #word{transition:none} }
</style>
</head>
<body>
<main class="screen">
  <header>
    <h1>눈으로 말해요</h1>
    <p class="hint" id="testHint" hidden>스페이스 짧게=깜박임 · 길게=감기</p>
  </header>

  <section class="board" aria-live="assertive">
    <p id="word" class="idle">카메라를 켜고 눈을 깜박여 보세요</p>
  </section>

  <section class="live">
    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="msg" id="camMsg">아래 ‘카메라 시작’을 눌러 주세요</div>
    </div>
    <div class="status">
      <p class="label">지금 센 깜박임</p>
      <div class="dots" id="dots"><span class="none">대기 중</span></div>
      <p class="label">눈 감김 정도</p>
      <div class="meter" aria-hidden="true"><i id="meterFill"></i><b id="meterMark"></b></div>
      <div class="hold" aria-hidden="true"><i id="holdFill"></i></div>
    </div>
  </section>

  <ul class="map" id="map" aria-label="깜박임 예시"></ul>

  <div class="btns">
    <button id="startBtn" type="button">카메라 시작</button>
    <button id="testBtn" class="ghost" type="button">키보드 테스트</button>
  </div>
</main>

<section class="more">
  <details>
    <summary>설정</summary>
    <label>감은 눈 기준 <span id="thVal"></span>
      <input id="th" type="range" min="0.2" max="0.8" step="0.05" value="0.45">
    </label>
    <label>마지막 깜박임 뒤 기다리는 시간 <span id="gapVal"></span>
      <input id="gap" type="range" min="600" max="2500" step="100" value="1200">
    </label>
    <label>‘길게 감기’로 볼 시간 <span id="longVal"></span>
      <input id="longMs" type="range" min="600" max="3000" step="100" value="1200">
    </label>
    <p class="small">한 번 깜박임도 단어로 바뀌므로, 평소의 자연스러운 깜박임에도 ‘반갑습니다’가 나올 수 있습니다.</p>
  </details>
  <details>
    <summary>기록</summary>
    <ol id="log"></ol>
  </details>
</section>

<script type="module">
  const WORDS = { 1: "반갑습니다", 2: "안녕하세요?", 3: "고마워요", 4: "사랑해요" };
  const LONG_WORD = "미안해요";

  const $ = id => document.getElementById(id);
  const wordEl = $("word"), dotsEl = $("dots"), logEl = $("log");
  const th = $("th"), gap = $("gap"), longMs = $("longMs");

  // 깜박임 예시
  $("map").innerHTML = Object.entries(WORDS)
    .map(([n, w]) => `<li data-n="${n}"><div class="sig">${"<span></span>".repeat(n)}</div><div class="cnt">${n}번</div><div class="w">${w}</div></li>`).join("")
    + `<li data-n="long"><div class="sig"><span class="bar"></span></div><div class="cnt">길게 감기</div><div class="w">${LONG_WORD}</div></li>`;

  function showSettings(){
    $("thVal").textContent = Math.round(th.value * 100) + "%";
    $("gapVal").textContent = (gap.value / 1000).toFixed(1) + "초";
    $("longVal").textContent = (longMs.value / 1000).toFixed(1) + "초 이상";
    $("meterMark").style.left = (th.value * 100) + "%";
  }
  th.oninput = gap.oninput = longMs.oninput = showSettings; showSettings();

  function showWord(key, word, label){
    document.querySelectorAll("#map li").forEach(r => r.classList.toggle("on", r.dataset.n == key));
    wordEl.classList.remove("idle");
    wordEl.textContent = word;
    wordEl.classList.add("pop"); setTimeout(() => wordEl.classList.remove("pop"), 250);
    const li = document.createElement("li");
    li.textContent = `${new Date().toLocaleTimeString("ko-KR")} · ${label} → ${word}`;
    logEl.prepend(li);
  }

  // ---- 깜박임 세기 ----
  let count = 0, timer = null;
  function renderDots(){
    dotsEl.innerHTML = count ? '<span class="dot"></span>'.repeat(count) : '<span class="none">대기 중</span>';
  }
  function onBlink(){
    count++;
    renderDots();
    clearTimeout(timer);
    timer = setTimeout(finish, Number(gap.value));
  }
  function finish(){
    const n = count;
    count = 0; renderDots();
    if (n < 1) return;
    showWord(n, WORDS[n] ?? `${n}번 (등록되지 않은 횟수)`, `${n}번 깜박임`);
  }

  // ---- 눈 감김/뜸 처리 (카메라와 키보드 공용) ----
  let closed = false, closeStart = 0, longFired = false;
  function eyeClose(){
    closed = true; closeStart = performance.now(); longFired = false;
    clearTimeout(timer);                   // 감고 있는 동안은 횟수 확정을 미룸
  }
  function eyeHoldCheck(){
    const held = closed ? performance.now() - closeStart : 0;
    $("holdFill").style.width = closed && !longFired ? Math.min(100, held / longMs.value * 100) + "%" : "0%";
    if (closed && !longFired && held >= Number(longMs.value)){
      longFired = true;
      count = 0; renderDots();             // 앞서 센 깜박임은 취소하고 길게 감기로 처리
      showWord("long", LONG_WORD, "길게 감기");
    }
  }
  function eyeOpen(){
    closed = false;
    $("holdFill").style.width = "0%";
    if (longFired) return;                 // 길게 감기였으면 깜박임으로 세지 않음
    onBlink();
  }

  // ---- 키보드(스페이스바) 테스트 ----
  let testMode = false, holdTimer = null;
  $("testBtn").onclick = () => {
    testMode = !testMode;
    $("testHint").hidden = !testMode;
    $("testBtn").textContent = testMode ? "테스트 끄기" : "키보드 테스트";
  };
  window.addEventListener("keydown", e => {
    if (!testMode || e.code !== "Space") return;
    e.preventDefault();
    if (e.repeat || closed) return;
    eyeClose();
    holdTimer = setInterval(eyeHoldCheck, 50);
  });
  window.addEventListener("keyup", e => {
    if (!testMode || e.code !== "Space" || !closed) return;
    e.preventDefault();
    clearInterval(holdTimer);
    eyeHoldCheck();
    eyeOpen();
  });

  // ---- 카메라 + MediaPipe 얼굴 인식 ----
  let landmarker = null, lastTime = -1;
  const video = $("video");

  $("startBtn").onclick = async () => {
    $("startBtn").disabled = true;
    $("startBtn").textContent = "준비 중…";
    $("camMsg").textContent = "인식 모델을 불러오는 중…";
    try {
      const { FaceLandmarker, FilesetResolver } =
        await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const files = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker = await FaceLandmarker.createFromOptions(files, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
      });
      $("camMsg").textContent = "카메라 권한을 허용해 주세요";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      video.srcObject = stream;
      await video.play();
      $("camMsg").hidden = true;
      $("startBtn").textContent = "카메라 켜짐";
      wordEl.textContent = "눈을 깜박이거나 길게 감아 보세요";
      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      $("camMsg").hidden = false;
      $("camMsg").textContent = "카메라를 시작하지 못했습니다. 권한을 허용했는지 확인해 주세요.";
      $("startBtn").textContent = "다시 시도";
      $("startBtn").disabled = false;
    }
  };

  function loop(){
    if (video.readyState >= 2 && video.currentTime !== lastTime){
      lastTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      const shapes = res.faceBlendshapes?.[0]?.categories;
      if (shapes){
        const get = name => shapes.find(c => c.categoryName === name)?.score ?? 0;
        const score = (get("eyeBlinkLeft") + get("eyeBlinkRight")) / 2;   // 0=뜸, 1=감음
        $("meterFill").style.width = Math.min(100, score * 100) + "%";
        const t = Number(th.value);
        if (!closed && score > t) eyeClose();                    // 눈 감김 시작
        else if (closed && score < t - 0.1) eyeOpen();           // 다시 뜨면 1회
      } else {
        $("meterFill").style.width = "0%";
      }
    }
    eyeHoldCheck();                                            // 오래 감고 있으면 길게 감기
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
