<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>깜박임 말하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  /* 레이아웃: 위쪽 큰 단어 판 + 아래 카메라·깜박임 카운터·설정 */
  :root{
    --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2621; --muted:#66746b;
    --accent:#2f7d5b; --accent-soft:#dcefe5; --line:#d6ddd8; --warn:#b4552d;
    --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
    --body:"Noto Sans KR",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a17; --panel:#1d2521; --fg:#e8eee9; --muted:#9aa8a0;
      --accent:#6cc79c; --accent-soft:#233a2f; --line:#2e3833; --warn:#e48a62; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
  main{max-width:880px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
  h1{font-family:var(--display);font-size:1.4rem;margin:0}
  .sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}

  .board{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    min-height:220px;display:grid;place-items:center;text-align:center;padding:24px}
  #word{font-family:var(--display);font-size:clamp(3.5rem,14vw,7rem);line-height:1.1;margin:0;color:var(--accent);
    transition:transform .25s ease}
  #word.pop{transform:scale(1.08)}
  #word.idle{color:var(--muted);font-size:clamp(1.3rem,4vw,1.8rem)}

  .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  @media (max-width:640px){.row{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
  .card h2{font-size:.85rem;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:700}

  .cam{position:relative;aspect-ratio:4/3;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:16px;text-align:center;font-size:.95rem}

  button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}

  .dots{display:flex;gap:10px;min-height:28px;align-items:center}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--accent)}
  .meter{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden;position:relative}
  .meter i{display:block;height:100%;width:0;background:var(--accent)}
  .meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
  .small{font-size:.85rem;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:.95rem}
  td{padding:6px 4px;border-bottom:1px solid var(--line)}
  td:first-child{font-variant-numeric:tabular-nums;color:var(--muted);width:90px}
  tr.on td{color:var(--accent);font-weight:700}
  label{display:grid;gap:4px;font-size:.9rem}
  input[type=range]{width:100%}
  #log{margin:0;padding-left:18px;font-size:.9rem;color:var(--muted);max-height:140px;overflow:auto}
</style>
</head>
<body>
<main>
  <header>
    <h1>깜박임 말하기</h1>
    <p class="sub">카메라를 보고 눈을 빠르게 연속으로 깜박이면 단어가 나타납니다.</p>
  </header>

  <section class="board" aria-live="assertive">
    <p id="word" class="idle">카메라를 켜고 눈을 깜박여 보세요</p>
  </section>

  <div class="row">
    <section class="card">
      <h2>카메라</h2>
      <div class="cam">
        <video id="video" playsinline muted></video>
        <div class="msg" id="camMsg">‘카메라 시작’을 눌러 주세요</div>
      </div>
      <div class="btns">
        <button id="startBtn" type="button">카메라 시작</button>
        <button id="testBtn" class="ghost" type="button">스페이스바로 테스트</button>
      </div>
      <p class="small" id="testHint" hidden>테스트 모드: 스페이스바 짧게 = 깜박임 한 번, 길게 누르기 = 길게 감기</p>
    </section>

    <section class="card">
      <h2>지금 센 깜박임</h2>
      <div class="dots" id="dots" aria-label="깜박임 횟수"></div>
      <div>
        <div class="meter" aria-hidden="true"><i id="meterFill"></i><b id="meterMark"></b></div>
        <p class="small">눈 감김 정도 (빨간 선을 넘으면 깜박임으로 셈)</p>
      </div>
      <h2>단어 표</h2>
      <table>
        <tbody id="map"></tbody>
      </table>
    </section>
  </div>

  <div class="row">
    <section class="card">
      <h2>설정</h2>
      <label>감은 눈 기준 <span id="thVal"></span>
        <input id="th" type="range" min="0.2" max="0.8" step="0.05" value="0.45">
      </label>
      <label>마지막 깜박임 뒤 기다리는 시간 <span id="gapVal"></span>
        <input id="gap" type="range" min="600" max="2500" step="100" value="1200">
      </label>
      <label>‘길게 감기’로 볼 시간 <span id="longVal"></span>
        <input id="longMs" type="range" min="600" max="3000" step="100" value="1200">
      </label>
      <p class="small">한 번 깜박임도 단어로 바뀌므로, 평소의 자연스러운 깜박임에도 ‘반갑습니다’가 나올 수 있습니다.</p>
    </section>
    <section class="card">
      <h2>기록</h2>
      <ol id="log"></ol>
    </section>
  </div>
</main>

<script type="module">
  const WORDS = { 1: "반갑습니다", 2: "안녕하세요?", 3: "고마워요", 4: "사랑해요" };
  const LONG_WORD = "미안해요";

  const $ = id => document.getElementById(id);
  const wordEl = $("word"), dotsEl = $("dots"), logEl = $("log");
  const th = $("th"), gap = $("gap"), longMs = $("longMs");

  // 단어 표
  $("map").innerHTML = Object.entries(WORDS)
    .map(([n, w]) => `<tr data-n="${n}"><td>${n}번 깜박임</td><td>${w}</td></tr>`).join("")
    + `<tr data-n="long"><td>길게 감기</td><td>${LONG_WORD}</td></tr>`;

  function showSettings(){
    $("thVal").textContent = Math.round(th.value * 100) + "%";
    $("gapVal").textContent = (gap.value / 1000).toFixed(1) + "초";
    $("longVal").textContent = (longMs.value / 1000).toFixed(1) + "초 이상";
    $("meterMark").style.left = (th.value * 100) + "%";
  }
  th.oninput = gap.oninput = longMs.oninput = showSettings; showSettings();

  function showWord(key, word, label){
    document.querySelectorAll("#map tr").forEach(r => r.classList.toggle("on", r.dataset.n == key));
    wordEl.classList.remove("idle");
    wordEl.textContent = word;
    wordEl.classList.add("pop"); setTimeout(() => wordEl.classList.remove("pop"), 250);
    const li = document.createElement("li");
    li.textContent = `${new Date().toLocaleTimeString("ko-KR")} · ${label} → ${word}`;
    logEl.prepend(li);
  }

  // ---- 깜박임 세기 ----
  let count = 0, timer = null;
  function renderDots(){ dotsEl.innerHTML = '<span class="dot"></span>'.repeat(count); }

  function onBlink(){
    count++;
    renderDots();
    clearTimeout(timer);
    timer = setTimeout(finish, Number(gap.value));
  }

  function finish(){
    const n = count;
    count = 0; renderDots();
    if (n < 1) return;
    showWord(n, WORDS[n] ?? `${n}번 (등록되지 않은 횟수)`, `${n}번 깜박임`);
  }

  // ---- 눈 감김/뜸 처리 (카메라와 스페이스바 공용) ----
  let closed = false, closeStart = 0, longFired = false;

  function eyeClose(){
    closed = true; closeStart = performance.now(); longFired = false;
    clearTimeout(timer);                   // 감고 있는 동안은 횟수 확정을 미룸
  }
  function eyeHoldCheck(){
    if (closed && !longFired && performance.now() - closeStart >= Number(longMs.value)){
      longFired = true;
      count = 0; renderDots();             // 앞서 센 깜박임은 취소하고 길게 감기로 처리
      showWord("long", LONG_WORD, "길게 감기");
    }
  }
  function eyeOpen(){
    closed = false;
    if (longFired) return;                 // 길게 감기였으면 깜박임으로 세지 않음
    onBlink();
  }

  // ---- 스페이스바 테스트 ----
  let testMode = false, holdTimer = null;
  $("testBtn").onclick = () => {
    testMode = !testMode;
    $("testHint").hidden = !testMode;
    $("testBtn").textContent = testMode ? "테스트 끄기" : "스페이스바로 테스트";
  };
  window.addEventListener("keydown", e => {
    if (!testMode || e.code !== "Space") return;
    e.preventDefault();
    if (e.repeat || closed) return;
    eyeClose();
    holdTimer = setInterval(eyeHoldCheck, 50);
  });
  window.addEventListener("keyup", e => {
    if (!testMode || e.code !== "Space" || !closed) return;
    e.preventDefault();
    clearInterval(holdTimer);
    eyeHoldCheck();
    eyeOpen();
  });

  // ---- 카메라 + MediaPipe 얼굴 인식 ----
  let landmarker = null, lastTime = -1;
  const video = $("video");

  $("startBtn").onclick = async () => {
    $("startBtn").disabled = true;
    $("camMsg").textContent = "인식 모델을 불러오는 중…";
    try {
      const { FaceLandmarker, FilesetResolver } =
        await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const files = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker = await FaceLandmarker.createFromOptions(files, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
      });
      $("camMsg").textContent = "카메라 권한을 허용해 주세요";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      video.srcObject = stream;
      await video.play();
      $("camMsg").hidden = true;
      $("startBtn").textContent = "카메라 켜짐";
      wordEl.textContent = "눈을 깜박이거나 길게 감아 보세요";
      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      $("camMsg").hidden = false;
      $("camMsg").textContent = "카메라 또는 모델을 시작하지 못했습니다. 크롬에서 열고 카메라 권한을 허용했는지 확인해 주세요. (" + err.message + ")";
      $("startBtn").disabled = false;
    }
  };

  function loop(){
    if (video.readyState >= 2 && video.currentTime !== lastTime){
      lastTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      const shapes = res.faceBlendshapes?.[0]?.categories;
      if (shapes){
        const get = name => shapes.find(c => c.categoryName === name)?.score ?? 0;
        const score = (get("eyeBlinkLeft") + get("eyeBlinkRight")) / 2;   // 0=뜸, 1=감음
        $("meterFill").style.width = Math.min(100, score * 100) + "%";
        const t = Number(th.value);
        if (!closed && score > t) eyeClose();                    // 눈 감김 시작
        else if (closed && score < t - 0.1) eyeOpen();           // 다시 뜨면 1회
        eyeHoldCheck();                                          // 오래 감고 있으면 길게 감기
      } else {
        $("meterFill").style.width = "0%";
      }
    }
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
